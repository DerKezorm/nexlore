# Tests on both systems the project is worked on, Linux and Windows (end to end on Linux only), and a trial build of
# the image.
# Nothing is published from here: an image goes out only from release.yml, when a tag is pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install the backend
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and test the backend
        working-directory: backend
        run: |
          python -m ruff check app tests
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint, test and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Editor in a real browser, then end to end, headless
        working-directory: frontend
        run: |
          # The system libraries Chromium needs are not guaranteed on the Ubuntu image; Windows needs none.
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
          # Round trips and the long test against data loss (Milkdown does not run in jsdom).
          npm run test:browser
          # End to end on Linux only: the image runs on Linux, and the Windows runner is so slow that five runs in
          # a row each found another test losing a race against its clock. On Windows the full end-to-end run stays
          # part of every block on the machine the project is worked on.
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright test; fi

      # A red end-to-end run leaves its picture and page snapshot, so it can be read instead of guessed at.
      - name: Keep what a failed end-to-end test saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: frontend/test-results/
          retention-days: 7

  image:
    name: Trial build of the image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build, do not push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
