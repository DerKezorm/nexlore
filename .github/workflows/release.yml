# Publishes a release: on a tag like v1.0.0, the tests once more, then the image for amd64 and arm64 into the GitHub
# Container Registry. Nothing else publishes; the everyday checks are in ci.yml.
name: Release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# One release at a time, and never cancelled: a half-published image is worse than a few minutes of waiting.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install the backend
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and test the backend
        working-directory: backend
        run: |
          python -m ruff check app tests
          python -m pytest -q

      # The version in the code must match the tag, or the app reports another version than the one installed.
      - name: Version matches the tag
        working-directory: backend
        run: |
          IN_CODE=$(python -c "import app; print(app.__version__)")
          AT_TAG="${GITHUB_REF_NAME#v}"
          echo "code: $IN_CODE / tag: $AT_TAG"
          if [ "$IN_CODE" != "$AT_TAG" ]; then
            echo "::error::backend/app/__init__.py says $IN_CODE, the tag says $AT_TAG."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint, test and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # NAS devices come with Intel/AMD and ARM.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out names and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
