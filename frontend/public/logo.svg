<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="nexlore">
  <!-- Mine cart with a web of knowledge, light on a white tile; dark when the system is dark.
       Same shape as components/Logo.tsx and scripts/app-icons.mjs. -->
  <style>
    .grund, .kf { fill: #fff } .rand { stroke: #1fb5a2; stroke-opacity: .35 }
    .ak { fill: #0e8f82; stroke: #fff } .as { stroke: #0e8f82 }
    .v1 { stop-color: #7fe0d0 } .v2 { stop-color: #1fb5a2 } .v3 { stop-color: #0b5f57 }
    .ring { stroke: #fff }
    @media (prefers-color-scheme: dark) {
      .grund, .kf { fill: #0a1615 } .rand { stroke: #2dd4bf; stroke-opacity: .45 }
      .ak { fill: #5eead4; stroke: #0a1615 } .as { stroke: #5eead4 }
      .v1 { stop-color: #ccfbf1 } .v2 { stop-color: #2dd4bf } .v3 { stop-color: #139486 }
      .ring { stroke: #0a1615 }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="54" y2="54">
      <stop offset="0" class="v1"/><stop offset=".5" class="v2"/><stop offset="1" class="v3"/>
    </linearGradient>
  </defs>
  <rect class="grund" x="2" y="2" width="60" height="60" rx="16"/>
  <rect class="rand" x="2.75" y="2.75" width="58.5" height="58.5" rx="15.3" fill="none" stroke-width="1.5"/>
