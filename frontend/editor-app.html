<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The editor talks to nobody: no fetch, no socket, no worker. Files come from the app (`asset`). -->
    <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'" />
    <title>nexlore editor</title>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="/src/editorapp/main.ts"></script>
  </body>
</html>
