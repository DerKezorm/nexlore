[tool.ruff]
target-version = "py313"
line-length = 120
# The shared modules and their contract tests are copied in unchanged and linted at their source.
extend-exclude = ["app/vendor/nexoidc", "tests/nexoidc", "app/vendor/nexkonten", "tests/nexkonten", "app/vendor/nexpost",
                  "tests/nexpost", "app/vendor/nexlog", "tests/nexlog", "app/vendor/nexsicherung",
                  "tests/nexsicherung", "app/vendor/nexschluessel", "tests/nexschluessel", "app/vendor/nexsprachen",
                  "tests/nexsprachen"]

[tool.ruff.lint]
extend-select = ["E501", "E402", "S608", "B", "I"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
