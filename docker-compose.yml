# nexlore, start with:  docker compose up -d --build
#
# Then open http://<your-host>:8470. The first account you create there is the operator.

services:
  nexlore:
    build: .
    container_name: nexlore
    restart: unless-stopped

    ports:
      # Host port on the left, container port on the right.
      - "8470:8000"

    volumes:
      # Database, logs, the operator's own languages (data/locales) and, unless NEXLORE_VAULT_DIR says otherwise,
      # the notes in data/vault.
      # ⚠️ A local disk, never an SMB or NFS share. SQLite's locking does not work reliably over network
      # filesystems, and that is how it loses data.
      - ./data:/data

    environment:
      # Who should own the files in the data directory. The container fixes the permissions itself on startup.
      PUID: 1000
      PGID: 1000

      TZ: Europe/Berlin

      # The notes can live in a folder of their own, for example one that Obsidian or Syncthing also works on.
      # Mount it and point nexlore at it:
      # NEXLORE_VAULT_DIR: /vault

      # A network share or container mount that delivers no change notifications: watch by polling instead.
      # NEXLORE_WATCH_POLLING: "true"

      # The address people use to reach nexlore, for invitation links, public pages and the OIDC redirect. Can
      # also be set in the interface.
      # NEXLORE_PUBLIC_URL: https://notes.example.com

      # Behind a reverse proxy: its address, so that the brake against password guessing sees the real sender.
      # NEXLORE_TRUSTED_PROXIES: 172.16.0.0/12

      # Behind a TLS proxy: the session cookie only over HTTPS, also when the proxy sends no X-Forwarded-Proto.
      # NEXLORE_COOKIE_SECURE: "on"

      # The code the first account needs. Without it nexlore makes one at every start until it is set up and
      # writes it to the log: docker logs nexlore
      # NEXLORE_SETUP_TOKEN: choose-a-long-one

      # The operator's settings only from these networks (behind a proxy only with NEXLORE_TRUSTED_PROXIES set).
      # NEXLORE_OPERATOR_NETWORKS: 192.168.0.0/16

    # Harder to break out of, if you like. With "user:" instead of PUID/PGID the container never runs as root, and
    # then all of the following work: nexlore writes only to /data and /tmp. Your data directory must belong to
    # that user already (sudo chown -R 1000:1000 ./data).
    # user: "1000:1000"
    # read_only: true
    # tmpfs:
    #   - /tmp
    # cap_drop: [ALL]
    # security_opt:
    #   - no-new-privileges:true
    # mem_limit: 1g
    # logging:
    #   options:
    #     max-size: "10m"
    #     max-file: "3"
